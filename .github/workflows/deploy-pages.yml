name: Deploy CallFilm Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: callfilm-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out site
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Validate public files
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq \
            'uses:[[:space:]]+[^[:space:]]+@(v[0-9]+([.][0-9]+){0,2}|main|master)([[:space:]]|$)' \
            .github/workflows/deploy-pages.yml
          test -s site/index.html
          test -s site/privacy/index.html
          test -s site/privacy/en/index.html
          test -s site/privacy/archive/2026-08-24/index.html
          grep -Fq 'https://akra.kr/mp4-transition-pages/privacy/' site/privacy/index.html
          grep -Fq 'help@akra.kr' site/privacy/index.html
          grep -Fq 'Hugging Face' site/privacy/index.html
          grep -Fq 'Firebase' site/privacy/index.html
          grep -Fq '1.3.0' site/privacy/index.html
          grep -Fq 'workflow_step' site/privacy/index.html
          grep -Fq 'workflow_step' site/privacy/en/index.html
          test -s site/privacy/archive/1.2.0/index.html
          test -s site/privacy/en/archive/1.2.0/index.html
          grep -Fq 'Hugging Face' site/privacy/en/index.html
          grep -Fq 'Firebase' site/privacy/en/index.html
          grep -Fq 'Turbo' site/support/index.html
          grep -Fq '574MB' site/support/index.html
          grep -Fq 'help@akra.kr' site/support/index.html
          printf '%s  %s\n' \
            '23b2189914c8ae0ace0a9fd7929421044d25f8abd3e1118940eda5c338397aa6' \
            'site/assets/phone-library.png' \
            '772de1cf5014751024ed6d59973fb90e7c2bf9541285bcce7f2febc3c12d02dd' \
            'site/assets/phone-editor.png' \
            'dd67b4c2855b69b1c15a89cbe6fb0a725533b44b5b37b9e47e01329b8ee4fd9e' \
            'site/assets/phone-rendering.png' \
            'd899f8a5f1b89c42687bf12809fdfff1ee9f9ef014b04114cafeb574b18bce05' \
            'site/assets/phone-completed.png' \
            | sha256sum --check --strict
          printf '%s  %s\n' \
            '6b34507570027d102e80c61a3059e5f4643cd8047adcf36cf1708fa26adbe7b7' \
            'site/assets/Review_Tone_20260715_120000.wav' \
            | sha256sum --check --strict

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
