name: Deploy CallFilm Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: callfilm-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out site
        uses: actions/checkout@v6

      - name: Validate public files
        shell: bash
        run: |
          set -euo pipefail
          test -s site/index.html
          test -s site/privacy/index.html
          test -s site/support/index.html
          test -s site/styles.css
          test -s site/assets/callfilm-icon.png
          test -s site/assets/phone-library.png
          test -s site/assets/Review_Tone_20260715_120000.wav
          grep -Fq 'BUILD 1' site/index.html
          grep -Fq 'Android 마켓 다운로드 예정' site/index.html
          grep -Fq 'https://akra.kr/mp4-transition-pages/privacy/' site/privacy/index.html
          grep -Fq 'Akra Dev Studio' site/privacy/index.html
          grep -Fq 'https://github.com/akra-devs/mp4-transition-pages/issues/new' site/privacy/index.html
          grep -Fq 'AI 자막과 결과 영상을 삭제합니다' site/privacy/index.html
          grep -Fq 'https://akra.kr/mp4-transition-pages/support/' site/support/index.html
          grep -Fq '기기의 영상 처리 기능에서 오류가 발생했습니다' site/support/index.html
          grep -Fq 'AI 자막을 만들지 못했습니다' site/support/index.html
          grep -Fq '자막 끄고 영상 만들기' site/support/index.html
          grep -Fq '자막 다시 시도' site/support/index.html
          grep -Fq '광고 설정' site/support/index.html
          grep -Fq '이 버전에서는 대량 만들기 광고를 사용할 수 없습니다' site/support/index.html
          grep -Fq '>다시 시도</strong>' site/support/index.html
          grep -Fq 'AI 자막과 결과 영상을 삭제합니다' site/support/index.html
          grep -Fq 'AI 자막과 완성 영상' site/index.html
          grep -Fq 'Pro 상품은 판매하지 않으며' site/support/index.html
          ! grep -Fq '앱을 업데이트한 뒤 다시 시도해 주세요' site/support/index.html
          ! grep -Fq 'Pro 판매는 준비 중' site/support/index.html
          ! grep -Fq 'Google Play 출시 후' site/support/index.html
          ! grep -Fq 'Google Play 출시 후' site/privacy/index.html
          printf '%s  %s\n' \
            '6b34507570027d102e80c61a3059e5f4643cd8047adcf36cf1708fa26adbe7b7' \
            'site/assets/Review_Tone_20260715_120000.wav' \
            | sha256sum --check --strict

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
