name: Deploy CallFilm Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: callfilm-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out site
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Validate public files
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq \
            'uses:[[:space:]]+[^[:space:]]+@(v[0-9]+([.][0-9]+){0,2}|main|master)([[:space:]]|$)' \
            .github/workflows/deploy-pages.yml
          test -s site/index.html
          test -s site/privacy/index.html
          test -s site/support/index.html
          test -s site/styles.css
          test -s site/assets/callfilm-icon.png
          test -s site/assets/phone-library.png
          test -s site/assets/phone-editor.png
          test -s site/assets/phone-rendering.png
          test -s site/assets/phone-completed.png
          test -s site/assets/Review_Tone_20260715_120000.wav
          grep -Fq 'BUILD 1' site/index.html
          grep -Fq 'Android 마켓 다운로드 예정' site/index.html
          grep -Fq 'https://akra.kr/mp4-transition-pages/privacy/' site/privacy/index.html
          grep -Fq 'Akra Dev Studio' site/privacy/index.html
          grep -Fq 'https://github.com/akra-devs/mp4-transition-pages/issues/new' site/privacy/index.html
          grep -Fq 'AI 자막과 결과 영상을 삭제합니다' site/privacy/index.html
          grep -Fq '처음 선택한 파일은 그대로' site/privacy/index.html
          grep -Fq 'https://akra.kr/mp4-transition-pages/support/' site/support/index.html
          grep -Fq '기기의 영상 처리 기능에서 오류가 발생했습니다' site/support/index.html
          grep -Fq 'AI 자막을 만들지 못했습니다' site/support/index.html
          grep -Fq '자막 끄고 영상 만들기' site/support/index.html
          grep -Fq '자막 다시 시도' site/support/index.html
          grep -Fq '광고 설정' site/support/index.html
          grep -Fq '이 버전에서는 대량 만들기 광고를 사용할 수 없습니다' site/support/index.html
          grep -Fq '>다시 시도</strong>' site/support/index.html
          grep -Fq '현재 앱 실행 중에는' site/privacy/index.html
          grep -Fq '현재 앱 실행 중에는' site/support/index.html
          grep -Fq '대량 만들기를 이용할 수 있습니다' site/privacy/index.html
          grep -Fq '대량 만들기를 이용할 수 있습니다' site/support/index.html
          grep -Fq 'AI 자막과 결과 영상을 삭제합니다' site/support/index.html
          grep -Fq '처음 선택한 파일은 그대로' site/support/index.html
          grep -Fq 'AI 자막과 완성 영상' site/index.html
          grep -Fq 'AI 자막은 음질에 따라 다르게 인식될 수 있습니다' site/index.html
          grep -Fq 'AI 자막은 음질에 따라 다르게 인식될 수 있습니다' site/support/index.html
          grep -Fq '완성 영상에서 자막을 확인한 뒤 저장·공유합니다' site/index.html
          grep -Fq '완성 화면의 재생' site/support/index.html
          grep -Fq 'Pro 상품은 판매하지 않으며' site/support/index.html
          ! grep -Eq \
            'phone-(ai-caption-model|caption-preview)[.]png|API [(]개발 예정[)]|외부 서버 [(]개발 예정[)]|상용 API와 외부 서버' \
            site/index.html site/support/index.html
          ! grep -Fq '앱을 업데이트한 뒤 다시 시도해 주세요' site/support/index.html
          ! grep -Fq 'Pro 판매는 준비 중' site/support/index.html
          ! grep -Fq 'Google Play 출시 후' site/support/index.html
          ! grep -Fq 'Google Play 출시 후' site/privacy/index.html
          ! grep -Eq '앱을 (종료|닫기)|앱 종료 전' \
            site/privacy/index.html site/support/index.html
          printf '%s  %s\n' \
            '23b2189914c8ae0ace0a9fd7929421044d25f8abd3e1118940eda5c338397aa6' \
            'site/assets/phone-library.png' \
            '772de1cf5014751024ed6d59973fb90e7c2bf9541285bcce7f2febc3c12d02dd' \
            'site/assets/phone-editor.png' \
            'dd67b4c2855b69b1c15a89cbe6fb0a725533b44b5b37b9e47e01329b8ee4fd9e' \
            'site/assets/phone-rendering.png' \
            'd899f8a5f1b89c42687bf12809fdfff1ee9f9ef014b04114cafeb574b18bce05' \
            'site/assets/phone-completed.png' \
            | sha256sum --check --strict
          printf '%s  %s\n' \
            '6b34507570027d102e80c61a3059e5f4643cd8047adcf36cf1708fa26adbe7b7' \
            'site/assets/Review_Tone_20260715_120000.wav' \
            | sha256sum --check --strict

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
